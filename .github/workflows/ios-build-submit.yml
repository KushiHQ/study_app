name: Build and Submit iOS

# Same shape as KushiHQ/expo-app: a local EAS build on a macOS runner, then
# upload to App Store Connect (TestFlight). Runs by hand, or on a push to main
# whose commit message contains [ios]. Needs the iOS signing credentials to be
# on EAS already (made by the first interactive `eas build -p ios`).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    # Expo SDK 54 still uses the application lifecycle. Upgrade Expo for UIScene
    # support before switching to Xcode 27 for Apple's April 2027 upload deadline.
    # https://github.com/expo/fyi/blob/main/ios-scene-lifecycle.md
    runs-on: macos-15
    environment: production
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Show Xcode and iOS SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create .env file
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env
          if [ -n '${{ secrets.EXPO_PUBLIC_RC_IOS_KEY }}' ]; then echo 'EXPO_PUBLIC_RC_IOS_KEY=${{ secrets.EXPO_PUBLIC_RC_IOS_KEY }}' >> .env; fi
          if [ -n '${{ secrets.EXPO_PUBLIC_RC_ANDROID_KEY }}' ]; then echo 'EXPO_PUBLIC_RC_ANDROID_KEY=${{ secrets.EXPO_PUBLIC_RC_ANDROID_KEY }}' >> .env; fi

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ hashFiles('package-lock.json') }}
          restore-keys: cocoapods-

      - name: Build iOS (local)
        run: |
          set -o pipefail
          eas build --platform ios --profile production --local --non-interactive 2>&1 | tee /tmp/eas-output.txt || true
          IPA_PATH=$(grep -oE '[^[:space:]]+\.ipa' /tmp/eas-output.txt | tail -1)
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then echo "Could not find the built .ipa"; exit 1; fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ${{ env.IPA_PATH }}
          retention-days: 14

      - name: Submit to App Store Connect (TestFlight)
        timeout-minutes: 15
        # Signs in with the App Store Connect API key EAS stores for ng.kushi.study
        # ([Expo] EAS Submit, key RQ5CRTYTSB), so EXPO_TOKEN is the only secret needed.
        run: eas submit --platform ios --profile production --non-interactive --path "$IPA_PATH"
