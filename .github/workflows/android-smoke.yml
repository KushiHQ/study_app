name: Android · emulator smoke test

# Builds an x86_64 release APK (debug-signed, nothing uploaded anywhere), opens it
# on an API 34 emulator against the production API, takes screenshots of the
# signed-out screens and fails on any crash in logcat.
# Runs on every push to staging, or by hand (Actions → Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [staging]

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - run: npm ci

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-smoke-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-smoke-

      - name: Build release APK (x86_64)
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon 2>&1 | tee ../gradle.log | grep -E "^> Task :app:|BUILD|FAILURE|error:" | tail -60
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=android/$APK" >> "$GITHUB_ENV"
          ls -l "$APK"

      - name: Save APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ${{ env.APK }}
            gradle.log
          retention-days: 7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-smoke.sh "${{ env.APK }}" smoke-out

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke-out
          retention-days: 7

      - name: Fail if the app crashed
        if: always()
        run: |
          if [ -s smoke-out/crashes.txt ]; then cat smoke-out/crashes.txt; exit 1; fi
